[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingmou-token-compression"
version = "0.1.0"
description = "Collected Lingmou input compression, deferred tools and task usage accounting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "mcp>=2,<3"]

[project.optional-dependencies]
proxy = ["tiktoken>=0.13,<1"]
test = ["pytest>=8,<10"]
compression = [
  "llmlingua>=0.2.2,<0.3",
  "pysqlite3-binary==0.5.4.post2; implementation_name == 'cpython' and platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[project.scripts]
codexscope-context = "codexscope.context_tools:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external: explicitly enabled tests that call an external provider and may incur cost"]
